name: multi-lang-news

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_USERS: ${PGBOUNCER_ADMIN_USERS:-postgres}
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      MAX_DB_CONNECTIONS: "25"
      MAX_PREPARED_STATEMENTS: "200"
      SERVER_TLS_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$DB_USER\" -d \"$$DB_NAME\" -Atqc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

